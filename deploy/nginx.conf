# Nginx in front of ZIPI: HTTPS, compression, live events, load balancing across servers.
upstream zipi {
  least_conn;
  server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
  # server 10.0.0.12:3000;   # add more ZIPI servers here
  keepalive 64;
}
server { listen 80; server_name zipi.example.com; return 301 https://$host$request_uri; }
server {
  listen 443 ssl http2;
  server_name zipi.example.com;
  ssl_certificate     /etc/letsencrypt/live/zipi.example.com/fullchain.pem;   # certbot --nginx
  ssl_certificate_key /etc/letsencrypt/live/zipi.example.com/privkey.pem;
  client_max_body_size 6m;
  location /api/stream {                     # live updates: no buffering, long-lived
    proxy_pass http://zipi; proxy_http_version 1.1; proxy_set_header Connection '';
    proxy_buffering off; proxy_read_timeout 1h;
    proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto https;
  }
  location / {
    proxy_pass http://zipi; proxy_http_version 1.1; proxy_set_header Connection '';
    proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;                 # long CSV exports
  }
}
